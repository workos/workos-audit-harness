# Vendor-neutral CI for packages/chat. Needs no secrets and builds against the
# neutral wrangler.toml, so it runs green on any fork.
#
# packages/chat is deliberately NOT an npm workspace member: it keeps its own
# package-lock.json (vendored WorkOS design system + React Router toolchain),
# so every step runs with packages/chat as the working directory and installs
# from that lockfile — root ci.yml does not cover it.
name: Chat CI

on:
  pull_request:
    paths:
      - "packages/chat/**"
      - ".github/workflows/chat-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: packages/chat

jobs:
  verify:
    name: Lint, migrate, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: packages/chat/package-lock.json

      - name: Configure Socket Firewall
        uses: workos/setup-socket-firewall@ca93dd8aa351f54f4729fe3377a9be23c631c25d
        with:
          token: ${{ secrets.PUBLIC_SOCKET_FIREWALL_TOKEN }}
          allow-external-fork-fallback: true

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      # --local applies the migrations to a throwaway miniflare sqlite, so this
      # only asserts the SQL in migrations/ still applies cleanly.
      - name: Validate migrations
        run: npm run db:migrate:local

      # The neutral build: bakes wrangler.toml. Proves the app compiles; the
      # artifact is discarded.
      - name: Build (vendor-neutral config)
        run: npm run build
        env:
          NODE_ENV: production
