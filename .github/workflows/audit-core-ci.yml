name: audit-core CI

on:
  pull_request:
    paths:
      - 'packages/audit-core/**'
      - '.github/workflows/audit-core-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-smoke-test:
    name: Build CLI binaries (smoke test)
    runs-on: ubuntu-latest
    env:
      WORKOS_AUDIT_HARNESS_SKIP_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Configure Socket Firewall
        uses: workos/setup-socket-firewall@ca93dd8aa351f54f4729fe3377a9be23c631c25d
        with:
          token: ${{ secrets.PUBLIC_SOCKET_FIREWALL_TOKEN }}
          allow-external-fork-fallback: true
          configure-bun: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install workspace dependencies
        run: npm install --no-audit --no-fund

      - name: Install Bun compile runtimes
        run: |
          set -euo pipefail
          BUN_VERSION="$(bun --version)"
          BUN_COMPILE_EXECUTABLES_DIR="${RUNNER_TEMP}/bun-compile-runtimes"
          mkdir -p "$BUN_COMPILE_EXECUTABLES_DIR"
          for package in \
            bun-darwin-aarch64 \
            bun-darwin-x64 \
            bun-linux-aarch64 \
            bun-windows-x64; do
            tgz="$(npm pack --pack-destination "$RUNNER_TEMP" "@oven/${package}@${BUN_VERSION}")"
            mkdir -p "$BUN_COMPILE_EXECUTABLES_DIR/$package"
            tar -xzf "$RUNNER_TEMP/$tgz" -C "$BUN_COMPILE_EXECUTABLES_DIR/$package" --strip-components=1
          done
          echo "BUN_COMPILE_EXECUTABLES_DIR=$BUN_COMPILE_EXECUTABLES_DIR" >> "$GITHUB_ENV"

      - name: Build all CLI targets
        run: npm run build:cli -w @workos-inc/audit-core

      - name: Verify build artifacts
        run: |
          set -euo pipefail
          cd packages/audit-core/build
          ls -la
          test -s workos-audit-harness-darwin-arm64
          test -s workos-audit-harness-darwin-x64
          test -s workos-audit-harness-linux-x64
          test -s workos-audit-harness-linux-arm64
          test -s workos-audit-harness-windows-x64.exe
          test -s manifest.json
          test -s SHA256SUMS.txt

      - name: Smoke test the Linux x64 binary
        run: |
          set -euo pipefail
          ./packages/audit-core/build/workos-audit-harness-linux-x64 --help | head -3
