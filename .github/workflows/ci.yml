# Universal CI — the one workflow here that runs green on any fork.
#
# Every other workflow in this directory is scoped to a single package by a
# `paths:` filter. (WorkOS's internal deploy pipeline lives in the private
# workos-audit-harness-deploy repo, not here.) Needs no secrets and touches no
# infrastructure, so it is safe to run on pull requests from forks.
#
# Deliberately has no `paths:` filter: the gaps it closes are the cross-package
# ones a path-filtered workflow structurally cannot see. Today an audit-core-only
# change can break the proxy typecheck with nothing noticing, and a change to
# scripts/bundle-plugins.mjs triggers no workflow at all.
name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  # audit-core's postinstall fetches prebuilt CLI binaries from GitHub Releases.
  # CI must never depend on a published release existing — a fresh fork has none
  # — and the checkout is the source of truth here anyway.
  WORKOS_AUDIT_HARNESS_SKIP_DOWNLOAD: "1"

jobs:
  verify:
    name: Verify workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # The version-bump check needs enough history to find the merge base
          # with the target branch. The default shallow clone has none.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          # Root workspace lockfile. packages/chat keeps its own lockfile and is
          # not a workspace member, so it is not covered by this install — its
          # lint/build run in chat-ci.yml.
          cache-dependency-path: package-lock.json

      - name: Configure Socket Firewall
        uses: workos/setup-socket-firewall@ca93dd8aa351f54f4729fe3377a9be23c631c25d
        with:
          token: ${{ secrets.PUBLIC_SOCKET_FIREWALL_TOKEN }}
          allow-external-fork-fallback: true

      - name: Install workspace dependencies
        run: npm install --no-audit --no-fund

      # plugin-versions.yml runs this too, but only when a version-bearing file
      # changes. Skew also appears via unfiltered paths (editing the checker
      # itself, or a bump landing in the marketplace manifest alone), so run it
      # unconditionally — it costs milliseconds.
      - name: Plugin versions are in sync
        run: npm run check:versions

      # Distribution here IS the git repo: marketplace clients install by
      # version, and pi loads dist/index.mjs straight from a checkout. A source
      # change that ships without a version bump therefore leaves every machine
      # on the old code with nothing to indicate it is stale — invisible on the
      # repo side and invisible on the machine.
      #
      # PR-only: it needs a base to diff against, and on a direct push to main
      # there is no meaningful one.
      - name: Plugin versions were bumped
        if: github.event_name == 'pull_request'
        run: npm run check:versions -- --changed-since ${{ github.event.pull_request.base.sha }}

      # proxy-ci.yml typechecks the proxy only when packages/proxy changes. The
      # proxy consumes shared audit-core types, so an audit-core-only PR can
      # break it invisibly.
      - name: Typecheck the proxy
        run: npm run verify -w @workos-inc/audit-proxy

      # The quick installer is zero-dependency and must at least parse and
      # detect — it is the first thing a brand-new adopter runs. The tarball
      # leg exercises the same pack+bin-link path `npx github:...` uses, so a
      # files/.npmignore mistake or broken bin mapping fails here, not on a
      # user's machine.
      - name: Quick installer smoke test
        run: |
          set -euo pipefail
          node packages/installer/bin.mjs --list
          node packages/installer/bin.mjs --help
          npm pack --pack-destination "$RUNNER_TEMP" > /dev/null
          npx --yes --package "$RUNNER_TEMP"/workos-audit-harness-*.tgz workos-audit-install --list

  bundle:
    name: Plugin bundles build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Configure Socket Firewall
        uses: workos/setup-socket-firewall@ca93dd8aa351f54f4729fe3377a9be23c631c25d
        with:
          token: ${{ secrets.PUBLIC_SOCKET_FIREWALL_TOKEN }}
          allow-external-fork-fallback: true
          configure-bun: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install workspace dependencies
        run: npm install --no-audit --no-fund

      # Each plugin ships a committed dist/ because a marketplace install copies
      # files without installing dependencies, so the entry points must already
      # be bundled. Nothing verified the bundler still runs: a bad import in
      # audit-core would first surface on a user's machine, at hook time, where
      # the hooks are contractually silent about their own failures.
      - name: Bundle every plugin
        run: node scripts/bundle-plugins.mjs

      # Deliberately NOT `git diff --exit-code packages/*/dist`. `bun build`
      # output is not byte-stable across bun versions, so a byte comparison would
      # go red on every bun release instead of on a real regression, and a CI
      # that cries wolf on a public repo gets ignored. Asserting the entry points
      # exist and are non-empty catches the failure mode that matters — the
      # bundle no longer builds — with no false positives. Whether the *committed*
      # dist/ was refreshed stays a reviewer concern.
      - name: Bundled entry points are present and non-empty
        run: |
          set -euo pipefail
          for f in \
            packages/claude-plugin/dist/server/index.mjs \
            packages/claude-plugin/dist/scripts/emit-event.mjs \
            packages/codex-plugin/dist/server/index.mjs \
            packages/codex-plugin/dist/scripts/emit-event.mjs \
            packages/openclaw-plugin/dist/server/index.mjs \
            packages/openclaw-plugin/dist/index.mjs \
            packages/opencode-plugin/dist/index.mjs \
            packages/opencode-plugin/dist/scripts/config-file.mjs \
            packages/opencode-plugin/dist/scripts/emit-batch.mjs \
            packages/opencode-plugin/dist/scripts/create-opencode-schemas.mjs \
            packages/opencode-plugin/dist/scripts/remove-opencode-schemas.mjs \
            packages/opencode-plugin/dist/scripts/print-config-status.mjs \
            packages/hermes-plugin/dist/scripts/emit-event.mjs \
            packages/hermes-plugin/dist/scripts/audit-query.mjs \
            packages/hermes-plugin/dist/scripts/config-file.mjs \
            packages/hermes-plugin/dist/scripts/hermes-audit-schemas.mjs \
            packages/hermes-plugin/dist/scripts/create-hermes-schemas.mjs \
            packages/hermes-plugin/dist/scripts/remove-hermes-schemas.mjs \
            packages/hermes-plugin/dist/scripts/print-config-status.mjs \
            packages/pi-extension/dist/index.mjs ; do
            test -s "$f" || { echo "::error::missing or empty bundle: $f"; exit 1; }
            echo "ok $f"
          done
